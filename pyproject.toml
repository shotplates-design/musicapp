[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-music"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mutagen>=1.47",
]

[tool.setuptools]
packages = ["app", "api"]
include-package-data = false

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.vercel]
entrypoint = "api.index:app"
